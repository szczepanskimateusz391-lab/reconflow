[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reconflow"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.14.1",
  "fastapi==0.115.8",
  "psycopg[binary]==3.2.4",
  "pydantic==2.10.6",
  "python-multipart==0.0.20",
  "SQLAlchemy==2.0.38",
  "uvicorn[standard]==0.34.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
